            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .search-box {
            background: white;
            border-radius: 50px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 1rem;
            color: #333;
        }

        .search-box input::placeholder {
            color: #999;
        }

        .search-icon {
            color: #667eea;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            opacity: 1;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .skill-card.hidden {
            display: none;
        }

        .skill-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .skill-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-right: 12px;
        }

        .skill-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #2d3748;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .skill-description {
            color: #4a5568;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: #f7fafc;
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #e2e8f0;
        }

        .no-results {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
            display: none;
        }

        .no-results.show {
            display: block;
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: white;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const skillsGrid = document.getElementById('skillsGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentFilter = 'all';

        function renderSkills(filteredSkills = skills) {
            skillsGrid.innerHTML = '';
            
            if (filteredSkills.length === 0) {
                noResults.classList.add('show');
            } else {
                noResults.classList.remove('show');
                filteredSkills.forEach(skill => {
                    const card = document.createElement('div');
                    card.className = 'skill-card';
                    card.innerHTML = `
                        <div class="skill-header">
                            <div class="skill-icon" style="background: ${skill.color}20;">
                                ${skill.icon}
                            </div>
                            <div class="skill-title">${skill.title}</div>
                        </div>
                        <div class="skill-description">${skill.description}</div>
                        <div class="skill-tags">
                            ${skill.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    `;
                    skillsGrid.appendChild(card);
                });
            }
        }

        function filterSkills() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = skills.filter(skill => {
                const matchesCategory = currentFilter === 'all' || skill.category === currentFilter;
                const matchesSearch = skill.title.toLowerCase().includes(searchTerm) ||
                                    skill.description.toLowerCase().includes(searchTerm) ||
                                    skill.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                return matchesCategory && matchesSearch;
            });
            renderSkills(filtered);
        }

        searchInput.addEventListener('input', filterSkills);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.category;
                filterSkills();
            });
        });

        renderSkills();
    </script>
